units:
  kx: cx
  ky: cy
outlines:
  _keys:
    - what: rectangle
      where: true
      size: [22, 21] # key footprint + margin for the hull
  board:
    - what: outline
      name: _keys
      fillet: 5 # rounded board edge

pcbs:
  sofle:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      switches:
        what: ceoloide/switch_choc_v1_v2
        where: true
        params:
          reversible: false # was true
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}_B"
          choc_v1_support: true
          choc_v2_support: true
          # switch footprint stays oriented for top-mount switches;
          # the hotswap socket pads land on the back automatically.

      diodes:
        what: ceoloide/diode_tht_sod123
        where: true
        params:
          from: "{{colrow}}_B"
          to: "{{row_net}}"
          include_tht: false
          reversible: false # was true
          side: B # SMD on the back
        adjust:
          shift: [-8, 0]
          rotate: 90

      leds:
        what: ceoloide/led_sk6812mini-e
        where: true
        params:
          reversible: false # was true
          reverse_mount: true # shines up through the board to the front
          side: B # LED body on the back
          P1: VCC
          P3: GND
          P2: "{{key.led_next}}"
          P4: "{{key.led_prev}}"
        adjust:
          shift: [0, -5]

      encoder_1:
        what: ceoloide/rotary_encoder_ec11_ec12
        where:
          - ref: extra_default_single
          - ref: mirror_extra_default_single
        params:
          A: GP23
          B: GP22
          C: GND
          reversible: false # was true

      encoder_2:
        what: ceoloide/rotary_encoder_ec11_ec12
        where:
          - ref: extra2_default_single
          - ref: mirror_extra2_default_single
        params:
          A: GP7
          B: GP8
          C: GND
          reversible: false # was true
points:
  zones:
    matrix:
      key:
        padding: ky
        spread: kx
        width: 17.5
        height: 16.5
      columns:
        pinky:
          key.stagger: 0
          key.column_net: GP27
        pinky2:
          key.stagger: 0
          key.column_net: GP26
        ring:
          key.stagger: 4.0
          key.column_net: GP25
        middle:
          key.stagger: 2.5
          key.column_net: GP24
        index:
          key.stagger: -2.5
          key.column_net: GP19
        outer:
          key.stagger: -2.5
          key.column_net: GP18
      rows:
        fn:
          row_net: GP6
        number:
          row_net: GP0
        top:
          row_net: GP1
        home:
          row_net: GP2
        bottom:
          row_net: GP3
    thumb_inner:
      anchor:
        ref: matrix_pinky_bottom
        shift: [29.34, -86.0]
        rotate: 0
      key:
        width: 17.5
        height: 16.5
        tags: [thumb]
        column_net: GP27
        row_net: GP4
      rows:
        thumb:
    thumb_inner2:
      anchor:
        ref: matrix_pinky2_bottom
        shift: [29.29, -84.9]
      key:
        width: 17.5
        height: 16.5
        tags: [thumb]
        column_net: GP26
        row_net: GP4
      rows:
        thumb:
    thumb_middle:
      anchor:
        ref: matrix_pinky2_bottom
        shift: [47.24, -84.9]
      key:
        width: 17.5
        height: 16.5
        tags: [thumb]
        column_net: GP25
        row_net: GP4
      rows:
        thumb:
    thumb_middle2:
      anchor:
        ref: matrix_index_bottom
        shift: [14.42, -90.8]
        rotate: -10
      key:
        width: 17.5
        height: 16.5
        tags: [thumb]
        column_net: GP24
        row_net: GP4
      rows:
        thumb:
    thumb_outer:
      anchor:
        ref: matrix_outer_bottom
        shift: [17.86, -88.8]
        rotate: -18
      key:
        width: 17.5
        height: 26.5
        tags: [thumb]
        column_net: GP19
        row_net: GP4
      rows:
        thumb:
    extra:
      anchor:
        ref: matrix_outer_fn
        shift: [kx, 9]
      key:
        width: 17.5
        height: 16.5
        tags: [combo]
        column_net: GP18
        row_net: GP4
      rows:
        single:
    extra2:
      anchor:
        ref: matrix_outer_fn
        shift: [kx, 26]
      key:
        width: 17.5
        height: 16.5
        tags: [combo]
        column_net: GP5
        row_net: GP6
      rows:
        single:
  mirror:
    ref: matrix_outer_home
    distance: 85
