# my-soffle left half: key geometry, board outline and case.
# Ergogen owns geometry only. Parts, nets and JLC data live in the KiCad schematic;
# scripts/place_from_ergogen.py moves the schematic's footprints onto these points.
#
# Geometry source: Keebart Sofle Choc Pro firmware layout (keyboard.json) at Choc
# spacing, plus an F-row on top and a second encoder above Keebart's knob.
# Every key carries row_code/col_index so SW<row_code><col_index> is its schematic reference,
# and led: north|east|south|west for the side of the key its per-key LED sits on.

meta:
  engine: 4.2.1
  name: my-soffle

units:
  kx: cx # 18
  ky: cy # 17
  # Keebart column heights relative to pinky, from keyboard.json (0.125u steps)
  # pinky and pinky2 sit a little higher than Keebart's firmware layout on the real board
  pinky_lift: 1.5
  stagger_ring: 0.25 ky - pinky_lift
  stagger_middle: 0.125 ky
  stagger_index: -0.125 ky
  stagger_outer: -0.125 ky
  # tray case: the PCB drops in from the top, parts face the floor, the switch plate closes it
  wall: 2            # side wall thickness
  # 8.2 mm total. Thicknesses measured off a Keebart Sofle Choc Pro BT: FR4 plate 0.75, printed spacer 1.6,
  # PCB 1.6. The USB-C is mid-mount, so it no longer sets the standoff. floor is the balancing term.
  floor: 2.05        # floor thickness under the PCB
  fit: 0.2           # clearance between the PCB edge and the wall
  pcb_t: 1.6
  socket_h: 1.85     # Kailh Choc hotswap socket: the tallest thing under the board once the USB-C is sunk
  standoff: 2.2      # gap under the PCB, set by socket_h with 0.35 mm of slack
  # J3's OLED header and the two EC11 encoders (SW16, SW65) sit body-up on F and push their leads into this
  # gap. With only 2.2 mm there they must be cropped flush; untrimmed they reach about 3 mm and will foul.
  # The spacer's thickness is set by the OLED module: the plate rests on the module's glass, so module
  # PCB + glass must come to spacer_t. Confirm the module's total thickness before printing one.
  spacer_t: 1.6      # 3D printed spacer between PCB and plate; the OLED module lies in a pocket in it
  # 0.75 mm is too thin to retain a Choc switch by its clips, so the switch is held by its hotswap socket
  # and the plate is a cover rather than a structural switch plate. That is how the measured board does it.
  plate_t: 0.75      # FR4 top plate
  # M2 countersunk screws down through the plate into a pillar or threaded insert in the case. Countersunk
  # because a proud head has nowhere to sit: keycaps cover 79% of the board, so only a flush head clears them.
  screw_d: 2.2       # M2 clearance hole
  screw_r: screw_d / 2
  # Boss under each screw: a plain pillar from the floor to the PCB underside, threading between the hotswap
  # sockets (only 0.35 mm of clear height below them, so no wide base). It holds a CNC Kitchen M2 x 3.0 heat-set
  # insert (3.6 mm knurl) in a blind 3.2 mm hole; the pillar is 4.25 mm tall against their 4 mm minimum. The
  # wall is 0.8 mm, under CNC Kitchen's 1.3 mm minimum, because H2 has only 2.61 mm to SW15's socket; every
  # screw point keeps boss_r + 0.2 mm to the nearest socket, pad, part and pin hole. An aluminium case would
  # need a 1.6 mm tap drill for M2 instead.
  insert_r: 1.6      # 3.2 mm hole
  insert_depth: 3.5  # 3.0 mm insert plus room for the displaced plastic; leaves 0.75 mm of floor under it
  boss_r: insert_r + 0.8
  case_h: floor + standoff + pcb_t + spacer_t + plate_t
  # Rounded top and bottom outer edges. Ergogen only extrudes flat outlines, so each fillet is four bands of
  # fil_r / 4, each pulled in by the arc's inset at its mid-height: fil_r - sqrt(fil_r^2 - t^2), t = 1/8, 3/8,
  # 5/8, 7/8 of fil_r (worked out for fil_r = 1; redo the insets if it changes). The rim keeps 0.8 mm flat.
  fil_r: 1
  fil_s: fil_r / 4
  fil_d1: 0.0078
  fil_d2: 0.0729
  fil_d3: 0.2194
  fil_d4: 0.5159
  # Mid-mount USB-C, Hong Cheng HC-TYPE-C-16P-C16B (LCSC C19274022), mounted on B.Cu. The body sinks
  # usbc_sink up into the board from its underside, so on a 1.6 mm PCB it is flush with the board top and
  # hangs usbc_below under the board, inside the standoff (2.2 mm, 0.54 mm to spare). The spacer and plate see
  # nothing of it. It needs the 9.24 x 5.75 mm edge cutout that board_pcb subtracts (_port_slots).
  # The sink is dimensioned on the manufacturer drawing; the overall height is not, and 3.26 is scaled off
  # it (the drawing's 2.56 is the mating cavity, not the body). C10B and C08B sink 1.0 and 0.8 instead.
  usbc_h: 3.26
  usbc_sink: 1.6
  usbc_below: usbc_h - usbc_sink  # 1.66 under the board underside; keep standoff above this
  usbc_slot_w: 9.24  # board cutout from the manufacturer drawing, opening onto the edge
  usbc_slot_d: 5.75
  runout: 2          # how far past the board edge the cutouts run, so they open cleanly onto it
  # Case port: a closed slot around the plug's metal shell (8.4 x 2.6 plus 0.3 mm a side), centred on the
  # connector body, with a 45 degree chamfer on the outer cham of the wall so a cable's moulding gets
  # closer to the connector. Ergogen only extrudes flat outlines, so the chamfer is three steps, each cut
  # at the midpoint of its slice of the slope.
  port_w: 9.0
  port_h: 3.2
  port_z: floor + standoff - usbc_below + usbc_h / 2   # body centre, 4.22 above the case bottom
  port_run: 3        # how far the cuts carry on past the wall's outer face (and, for the slot, inside it)
  cham: 1.3
  cham_step: cham / 3
  cg1: cham - cham_step / 2        # growth of each chamfer step, outermost first
  cg2: cham - 3 * cham_step / 2
  cg3: cham - 5 * cham_step / 2
  # 0.91 inch OLED 128x32 (SSD1306) soldered flat on the 4-pin J3, face up, reaching from the header row
  # toward the top edge. Module drawing (lcdwiki MC091GX): PCB 38 x 12 mm, pin row 1.5 mm from one short end,
  # glass 30 x 11.5 mm from 3.5 to 33.5 mm past the pin row. The openings hang off the oled_header point
  # (J3 pin 1), so they follow J3 and mirror with it.
  # The plate OVERLAPS the glass by a 0.75 mm lip and rests on it, which is the dip you see around the screen
  # on the Keebart board. So the opening is smaller than the glass, not larger. It still has to clear the
  # active area (about 22.4 x 5.6 mm on this panel), which it does with room to spare.
  display_lip: 0.75
  display_w: 11.5 - 2 display_lip   # across the header row, glass is 11.5 mm
  display_l: 30 - 2 display_lip     # along the module, glass is 30 mm
  display_row: 3.81    # J3 pin 1 to the middle of its 4-pin, 2.54 mm pitch row
  display_glass: 18.5  # pin row to the glass centre (3.5 + 30 / 2)
  # The right half is the left mirrored, sitting half_gap past the left half's inner edge so both halves
  # share one board file with room for tabs between them.
  half_gap: 10

points:
  # Every point is mirrored for the right half, across a vertical line half_gap / 2 past the left half's
  # inner edge. That edge is _shape's matrix_outer_fn + kx + 10.5; keep the two in step.
  mirror:
    ref: matrix_outer_fn
    shift: [kx + 10.5, 0]
    distance: half_gap
  zones:
    matrix:
      key:
        padding: ky
        spread: kx
        width: kx
        height: ky
        led: north
      columns:
        pinky:
          key.col_index: 0
        pinky2:
          key.col_index: 1
        ring:
          key.col_index: 2
          key.stagger: stagger_ring
        middle:
          key.col_index: 3
          key.stagger: stagger_middle
        index:
          key.col_index: 4
          key.stagger: stagger_index
        outer:
          key.col_index: 5
          key.stagger: stagger_outer
      # Ergogen stacks rows bottom-up; row_code matches the schematic (F=1 N=2 T=3 H=4 B=5)
      rows:
        bottom:
          row_code: 5
        home:
          row_code: 4
        top:
          row_code: 3
        number:
          row_code: 2
        fn:
          row_code: 1

    # thumb row and inner column, placed from Keebart's key centres relative to matrix_pinky_bottom
    thumb0:
      anchor: {ref: matrix_pinky_bottom, shift: [1.5 kx, -1 ky - pinky_lift + 1]} # SW60 up 1 mm with the pinky side
      key: {row_code: 6, col_index: 0, width: kx, height: ky, led: north}
    thumb1:
      anchor: {ref: matrix_pinky_bottom, shift: [2.5 kx, -0.875 ky - pinky_lift]}
      key: {row_code: 6, col_index: 1, width: kx, height: ky, led: north}
    thumb2:
      anchor: {ref: matrix_pinky_bottom, shift: [3.5 kx, -0.875 ky - pinky_lift]}
      key: {row_code: 6, col_index: 2, width: kx, height: ky, led: north}
    # TH3 and TH4 are measured off the user's Keebart board: a printed gauge with a 15.4 mm window per switch
    # dropped flush over all 17 home, bottom and thumb switches at these values. The earlier caliper fit on
    # keycap corners (-8.06 and -19.63 degrees) turned both keys too little.
    thumb3:
      anchor: {ref: matrix_pinky_bottom, shift: [82.850, -16.750 - pinky_lift], rotate: -13.5}
      key: {row_code: 6, col_index: 3, width: kx, height: ky, led: north}
    thumb4: # 1.5u tall key, LED west like Keebart's
      anchor: {ref: matrix_pinky_bottom, shift: [103.700, -18.400 - pinky_lift], rotate: -26}
      # Ergogen copies meta onto the mirror unchanged, so the right TH4's LED has to be told to face east
      key: {row_code: 6, col_index: 4, width: kx, height: 1.5 ky, led: west, mirror: {led: east}}
    encoder1: # Keebart's knob position moved 2.875 mm down for knob room (SW65), set by the user in KiCad with
      # the thumb cluster; x stays on encoder 2's column. Electrically thumb row column 5.
      anchor: {ref: matrix_pinky_bottom, shift: [6 kx, 0.625 ky - 2.875 - pinky_lift]}
      key: {row_code: 6, col_index: 5, width: kx, height: ky, combo: true, led: north}
    # M2 screw points: four around the key field plus an optional centre, picked on a render of the placed
    # board. Each keeps 1.0 mm of plate web to the nearest 13.8 mm switch cutout and 0.4 mm to the nearest
    # copper. They are points rather than bare shifts so they mirror with every other point for the right half.
    screw_tr:
      anchor: {ref: matrix_pinky_bottom, shift: [80.990, 60.970]}
      key: {mount_ref: H2}
    screw_tl:
      anchor: {ref: matrix_pinky_bottom, shift: [8.710, 59.190]}
      key: {mount_ref: H1}
    # H3 is the one screw that is not a mirror: hotswap sockets are not mirrored, and at the left's spot the right
    # half has only 2.18 mm to SW232's socket, too little for an insert pillar (boss_r + 0.2). The right H3 sits
    # 0.25 mm inward and 0.75 mm lower (2.68 mm of room). asym keeps each point on its own half.
    screw_mid: # optional: the user was unsure whether the plate needs a centre fixing
      anchor: {ref: matrix_pinky_bottom, shift: [45.020, 29.520]}
      key: {mount_ref: H3, asym: source}
    screw_mid_right:
      anchor: {ref: matrix_pinky_bottom, shift: [44.770, 28.770]}
      key: {mount_ref: H3, asym: clone}
    screw_br:
      anchor: {ref: matrix_pinky_bottom, shift: [94.840, -9.820]}
      key: {mount_ref: H5}
    screw_bl: # moved 0.9 mm down and inward from (17.08, -10.28) to clear SW51's and SW251's sockets for an insert
      anchor: {ref: matrix_pinky_bottom, shift: [16.580, -11.030]}
      key: {mount_ref: H4}
    # Connector points: the footprint origins of J1 and J2 (the mouth centre on the board edge, see the USB-C
    # footprint) and J3 (pin 1). The PCB notches, case ports, spacer pockets and display openings hang off
    # them, and the placement script puts the footprints on them, so board and case cannot drift apart.
    # rotate is the footprint's KiCad orientation; J2 and J3 face the inner edge.
    usbc_host:
      anchor: {ref: matrix_pinky_bottom, shift: [108.779481, 78.625]}
      key: {mount_ref: J1}
    # J2 sits on the inner edge below the encoder. y -7.1 leaves about 0.3 mm from its shield legs to a hotswap
    # socket pad on both halves: SW65's above it on the left, SW264's below it on the right (sockets are not
    # mirrored, so no single y is roomier on both).
    usbc_link:
      anchor: {ref: matrix_pinky_bottom, shift: [118.5, -7.1], rotate: -90}
      key: {mount_ref: J2}
    # J3 sits so the screen lines up over the encoder column (x 108), as on Keebart's board: the module's
    # centre is at 111.52 - display_row = 107.71. It moved from 114.06 by exactly one 2.54 mm pin pitch rather
    # than the 2.25 an exact centre needs, so the routing lanes between the header pins stayed lanes.
    oled_header:
      anchor: {ref: matrix_pinky_bottom, shift: [111.52, 39.1], rotate: -90}
      key: {mount_ref: J3}
    # BOOT (SW1) and RESET (SW2) side by side, turned upright, in the gap between the middle column's bottom key and
    # TH2, mirrored on the right half so the case floor's pin holes (_button_hole) sit the same on either half.
    # The centre was searched for clearance from every bottom-side pad, hole, courtyard and hotswap socket.
    button_boot:
      anchor: {ref: matrix_pinky_bottom, shift: [58.25, -6.0], rotate: 90}
      key: {mount_ref: SW1}
    button_reset:
      anchor: {ref: matrix_pinky_bottom, shift: [62.25, -6.0], rotate: 90}
      key: {mount_ref: SW2}

    encoder2: # above encoder 1 (SW16), 21.5 mm apart. Never closer than 18: at 17 the combo footprints short,
      # and turning one 180 instead shorts its socket pad into the outer column key's socket
      anchor: {ref: matrix_pinky_bottom, shift: [6 kx, 0.625 ky + 18 - pinky_lift]}
      key: {row_code: 1, col_index: 6, width: kx, height: ky, combo: true, led: north}

outlines:
  # Upper half of the board outline: the earlier key-rectangle outline (1.5 mm past the key pitch, enough for socket
  # pads and combo tab slots at 9.8 mm from key centre), whose offset steps the user preferred along the top
  # thumbs are left out: the drawn lower half owns them, and TH4's rectangle would leave a hairline sliver along it
  _keycaps:
    - what: rectangle
      where: /^(matrix|encoder)/
      size: [kx + 3, ky + 3]
  # inner column from encoder 1 up to the top: encoders, display, controller and USB-C live here
  # its top is anchored to the outer column's F-row key so the long top edge stays level with it
  _inner:
    - what: polygon
      points:
        - {ref: matrix_outer_fn, shift: [9, 10]}
        - {ref: matrix_outer_fn, shift: [kx + 10.5, 10]}
        - {ref: encoder1, shift: [10.5, -10]}
        - {ref: encoder1, shift: [-9, -10]}
  _raw:
    - what: outline
      name: _keycaps
    - operation: add
      what: outline
      name: _inner
  # morphological closing (grow 3 mm, shrink 3 mm) fills the slivers the overlapping key rectangles
  # leave at stagger steps, which would otherwise be milled as holes
  _closed:
    - what: outline
      name: _raw
      expand: 3
      joints: pointy
  _stepped:
    - what: outline
      name: _closed
      expand: -3
      joints: pointy
  # Lower half of the board outline, drawn by the user: straight right edge
  # down to TH4, along TH4's outer edge to its lowest corner, a slanted edge up to a straight bottom under the thumbs and a chamfer up to the
  # pinky column. Margin is 1.5 mm past the 18 x 17 key pitch. Corners on keys are anchored to them; the three
  # marked "fitted" points are where edges cross and were computed for the current thumb positions, so
  # recompute them if TH0-TH4 or the encoder column move.
  _shape:
    - what: polygon
      points:
        - {ref: matrix_pinky_fn, shift: [-10.5, 10]}
        - {ref: matrix_pinky2_fn, shift: [9, 10]}
        - {ref: matrix_ring_fn, shift: [-9, 10]}
        - {ref: matrix_ring_fn, shift: [9, 10]}
        - {ref: matrix_middle_fn, shift: [-9, 10]}
        - {ref: matrix_middle_fn, shift: [9, 10]}
        - {ref: matrix_index_fn, shift: [-9, 10]}
        - {ref: matrix_index_fn, shift: [9, 10]}
        - {ref: matrix_outer_fn, shift: [-9, 10]}
        - {ref: matrix_outer_fn, shift: [kx + 10.5, 10]}
        - {ref: matrix_pinky_bottom, shift: [118.500, -13.508]} # fitted: right edge meets TH4's outer edge
        - {ref: thumb4, shift: [10.5, -14.25]}
        # The two slanted edges take Keebart's angles, measured off their product photo through the switch holes:
        # 19.7 degrees from TH4's corner up to the bottom line, and a 33.2 degree chamfer from the pinky corner.
        - {ref: matrix_pinky_bottom, shift: [87.660, -30.425]} # fitted: 19.7 deg edge from TH4's corner meets the bottom line
        - {ref: matrix_pinky_bottom, shift: [20.713, -30.425]} # fitted: 33.2 deg chamfer meets the bottom line
        - {ref: matrix_pinky_bottom, shift: [-10.5, -10]}
  # The two mid-mount USB-C cutouts. They have to be part of the board outline rather than Edge.Cuts
  # inside the connector footprint: a notch drawn in the footprint only T-joins the edge, and KiCad
  # rejects that as a malformed outline and falls back to the bounding box. Drawn in each connector's
  # frame (mouth toward +y), so one shape serves J1 and J2 and mirrors with them.
  _port_slots:
    - what: rectangle
      where: {ref: usbc_host, shift: [0, (runout - usbc_slot_d) / 2]}
      size: [usbc_slot_w, usbc_slot_d + runout]
    - operation: add
      what: rectangle
      where: {ref: usbc_link, shift: [0, (runout - usbc_slot_d) / 2]}
      size: [usbc_slot_w, usbc_slot_d + runout]
  # Board outline (PCB edge and case): the stepped top of _stepped combined with the drawn lower half
  board:
    - what: outline
      name: _stepped
    - operation: add
      what: outline
      name: _shape
  # What Edge.Cuts actually gets. The case, spacer and plate keep the un-notched "board": the shell
  # already opens for the ports through the _port_host_*/_port_link_* cuts, and expanding a notched outline by the
  # wall thickness would tear a second gap in the case wall.
  board_pcb:
    - what: outline
      name: board
    - operation: subtract
      what: outline
      name: _port_slots
  # switch plate cutouts for a plate case (Choc plate hole 13.8 mm). Keys only: "where: true" would put a
  # 13.8 mm cutout on each screw point too.
  _switch_holes:
    - what: rectangle
      where: /^(matrix|thumb|encoder)/
      size: [13.8, 13.8]
  # M2 clearance holes through the plate. The PCB gets its own NPTH holes from the schematic's H1-H5
  # mounting-hole footprints, placed on these same points, so plate and board cannot drift apart.
  _screw_holes:
    - what: circle
      where: /^screw/
      radius: screw_r
  _boss:
    - what: circle
      where: /^screw/
      radius: boss_r
  _insert_hole:
    - what: circle
      where: /^screw/
      radius: insert_r
  # A pin hole in the floor under each of BOOT and RESET (both on B.Cu, facing the floor, plunger on the
  # point): sized for a SIM ejector pin (0.8 to 1 mm), with room for a printed hole coming out small
  _button_hole:
    - what: circle
      where: /^button_/
      radius: 0.75
  # the whole OLED module, not just its glass: it lies in a pocket through the printed spacer, which is why
  # spacer_t matches the module's 1.2 mm PCB. The FR4 plate above only opens for the glass (_display_hole).
  # The module board runs from 1.5 mm behind the pin row to 36.5 mm past it; the pocket is centred on it
  # (17.5 = display_glass - 1) with 0.5 mm clearance all round.
  # orient cancels J3's turn so the shift and size read in board axes (mirrored points negate both)
  _display_module:
    - what: rectangle
      where: {ref: oled_header, orient: 90, shift: [-display_row, display_glass - 1]}
      size: [13, 39]

  # case shell outlines. Port rectangles are centred on each USB-C's mouth, in the connector's frame.
  _case_outer:
    - what: outline
      name: board
      expand: wall
  # fillet bands, band 1 next to the straight wall, band 4 at the top or bottom face
  _case_f1:
    - {what: outline, name: board, expand: wall - fil_d1}
  _case_f2:
    - {what: outline, name: board, expand: wall - fil_d2}
  _case_f3:
    - {what: outline, name: board, expand: wall - fil_d3}
  _case_f4:
    - {what: outline, name: board, expand: wall - fil_d4}
  _case_cavity:
    - what: outline
      name: board
      expand: fit
  _display_hole:
    - what: rectangle
      where: {ref: oled_header, orient: 90, shift: [-display_row, display_glass]}
      size: [display_w, display_l]
  # Port cross-sections, drawn flat in the connector's frame (mouth on the board edge, +y outward) and laid on
  # their side by the shell. The shell cuts each one twice, turned +90 and -90, so the cut reaches equally
  # both ways from the outline's centre: that keeps it right on the mirrored right half, where make_both.js
  # copies a rotation unchanged. The slot is centred mid-wall and reaches port_run past the wall on each
  # side; each chamfer step runs from its depth inside the outer face (wall) to port_run past it.
  _port_host_slot:
    - {what: rectangle, where: {ref: usbc_host, shift: [0, wall / 2]}, size: [port_w, port_h], corner: port_h / 2}
  _port_host_c1:
    - {what: rectangle, where: {ref: usbc_host, shift: [0, wall + (port_run - cham_step) / 2]}, size: [port_w + 2 cg1, port_h + 2 cg1], corner: port_h / 2 + cg1}
  _port_host_c2:
    - {what: rectangle, where: {ref: usbc_host, shift: [0, wall + (port_run - 2 cham_step) / 2]}, size: [port_w + 2 cg2, port_h + 2 cg2], corner: port_h / 2 + cg2}
  _port_host_c3:
    - {what: rectangle, where: {ref: usbc_host, shift: [0, wall + (port_run - cham) / 2]}, size: [port_w + 2 cg3, port_h + 2 cg3], corner: port_h / 2 + cg3}
  _port_link_slot:
    - {what: rectangle, where: {ref: usbc_link, shift: [0, wall / 2]}, size: [port_w, port_h], corner: port_h / 2}
  _port_link_c1:
    - {what: rectangle, where: {ref: usbc_link, shift: [0, wall + (port_run - cham_step) / 2]}, size: [port_w + 2 cg1, port_h + 2 cg1], corner: port_h / 2 + cg1}
  _port_link_c2:
    - {what: rectangle, where: {ref: usbc_link, shift: [0, wall + (port_run - 2 cham_step) / 2]}, size: [port_w + 2 cg2, port_h + 2 cg2], corner: port_h / 2 + cg2}
  _port_link_c3:
    - {what: rectangle, where: {ref: usbc_link, shift: [0, wall + (port_run - cham) / 2]}, size: [port_w + 2 cg3, port_h + 2 cg3], corner: port_h / 2 + cg3}

cases:
  bottom:
    - what: outline
      name: board
      extrude: 2
  # printed spacer that holds the FR4 plate off the PCB. Same outline as the board, opened for the switches,
  # the screws and a pocket the OLED module drops into.
  spacer:
    - what: outline
      name: board
      extrude: spacer_t
    - what: outline
      name: _switch_holes
      extrude: spacer_t
      operation: subtract
    - what: outline
      name: _screw_holes
      extrude: spacer_t
      operation: subtract
    - what: outline
      name: _display_module
      extrude: spacer_t
      operation: subtract

  plate:
    - what: outline
      name: board
      extrude: plate_t
    - what: outline
      name: _switch_holes
      extrude: plate_t
      operation: subtract
    - what: outline
      name: _display_hole
      extrude: plate_t
      operation: subtract
    - what: outline
      name: _screw_holes
      extrude: plate_t
      operation: subtract

  # Tray case for print tests before committing to aluminium. No screw bosses or magnets yet:
  # how the PCB is held is still open, so only the shell and the two port openings are defined.
  shell:
    - what: outline
      name: _case_outer
      extrude: case_h - 2 fil_r
      shift: [0, 0, fil_r]
    - {what: outline, name: _case_f1, extrude: fil_s, shift: [0, 0, fil_r - fil_s], operation: add}
    - {what: outline, name: _case_f2, extrude: fil_s, shift: [0, 0, fil_r - 2 fil_s], operation: add}
    - {what: outline, name: _case_f3, extrude: fil_s, shift: [0, 0, fil_r - 3 fil_s], operation: add}
    - {what: outline, name: _case_f4, extrude: fil_s, shift: [0, 0, 0], operation: add}
    - {what: outline, name: _case_f1, extrude: fil_s, shift: [0, 0, case_h - fil_r], operation: add}
    - {what: outline, name: _case_f2, extrude: fil_s, shift: [0, 0, case_h - fil_r + fil_s], operation: add}
    - {what: outline, name: _case_f3, extrude: fil_s, shift: [0, 0, case_h - fil_r + 2 fil_s], operation: add}
    - {what: outline, name: _case_f4, extrude: fil_s, shift: [0, 0, case_h - fil_s], operation: add}
    - what: outline
      name: _case_cavity
      extrude: case_h
      shift: [0, 0, floor]
      operation: subtract
    # USB-C ports: J1 faces +y, so its cuts turn about x; J2 faces +x, so its cuts turn about y. Each outline
    # is cut at +90 and -90, extruded by half its length, so the pair spans the length centred on the outline.
    - {what: outline, name: _port_host_slot, extrude: wall / 2 + port_run, rotate: [90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_host_slot, extrude: wall / 2 + port_run, rotate: [-90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_host_c1, extrude: (port_run + cham_step) / 2, rotate: [90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_host_c1, extrude: (port_run + cham_step) / 2, rotate: [-90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_host_c2, extrude: (port_run + 2 cham_step) / 2, rotate: [90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_host_c2, extrude: (port_run + 2 cham_step) / 2, rotate: [-90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_host_c3, extrude: (port_run + cham) / 2, rotate: [90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_host_c3, extrude: (port_run + cham) / 2, rotate: [-90, 0, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_slot, extrude: wall / 2 + port_run, rotate: [0, 90, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_slot, extrude: wall / 2 + port_run, rotate: [0, -90, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_c1, extrude: (port_run + cham_step) / 2, rotate: [0, 90, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_c1, extrude: (port_run + cham_step) / 2, rotate: [0, -90, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_c2, extrude: (port_run + 2 cham_step) / 2, rotate: [0, 90, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_c2, extrude: (port_run + 2 cham_step) / 2, rotate: [0, -90, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_c3, extrude: (port_run + cham) / 2, rotate: [0, 90, 0], shift: [0, 0, port_z], operation: subtract}
    - {what: outline, name: _port_link_c3, extrude: (port_run + cham) / 2, rotate: [0, -90, 0], shift: [0, 0, port_z], operation: subtract}
    # Screw pillars, added after the cavity or it would cut them away again. A plain cylinder from the floor
    # to the PCB underside, threading between the hotswap sockets. The insert hole is blind: it comes down
    # insert_depth from the pillar top and stops inside the floor, so nothing shows on the case bottom.
    - what: outline
      name: _boss
      extrude: standoff
      shift: [0, 0, floor]
      operation: add
    - what: outline
      name: _insert_hole
      extrude: insert_depth
      shift: [0, 0, floor + standoff - insert_depth]
      operation: subtract
    - what: outline
      name: _button_hole
      extrude: floor
      operation: subtract

pcbs:
  outline_only:
    template: kicad8
    outlines:
      edge:
        outline: board_pcb
