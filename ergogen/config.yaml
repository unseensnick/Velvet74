# my-soffle left half: key geometry, board outline and case.
# Ergogen owns geometry only. Parts, nets and JLC data live in the KiCad schematic;
# scripts/place_from_ergogen.py moves the schematic's footprints onto these points.
#
# Geometry source: Keebart Sofle Choc Pro firmware layout (keyboard.json) at Choc
# spacing, plus an F-row on top and a second encoder above Keebart's knob.
# Every key carries row_code/col_index so SW<row_code><col_index> is its schematic reference,
# and led: north|east|south|west for the side of the key its per-key LED sits on.

meta:
  engine: 4.2.1
  name: my-soffle

units:
  kx: cx # 18
  ky: cy # 17
  # Keebart column heights relative to pinky, from keyboard.json (0.125u steps)
  # pinky and pinky2 sit a little higher than Keebart's firmware layout on the real board
  pinky_lift: 1.5
  stagger_ring: 0.25 ky - pinky_lift
  stagger_middle: 0.125 ky
  stagger_index: -0.125 ky
  stagger_outer: -0.125 ky
  # tray case: the PCB drops in from the top, parts face the floor, the switch plate closes it
  wall: 2            # side wall thickness
  floor: 2           # floor thickness under the PCB
  fit: 0.2           # clearance between the PCB edge and the wall
  standoff: 4.5      # gap under the PCB: the USB-C body is 3.26 mm and is the tallest part down there
  pcb_t: 1.6
  plate_t: 1.2       # FR4 switch plate
  case_h: floor + standoff + pcb_t + plate_t   # wall runs up past the plate, so the plate sits flush in the case
  usbc_h: 3.26       # HRO TYPE-C-31-M-12 body height above the PCB surface (its own datasheet)
  port_margin: 0.75  # slack around the connector so a plug nose enters without fouling the wall
  port_h: usbc_h + 2 port_margin
  port_z: floor + standoff - usbc_h - port_margin
  # 0.91 inch OLED 128x32 (SSD1306) soldered flat on the 4-pin J3, face up, reaching from the header row
  # toward the top edge. Module drawing (lcdwiki MC091GX): PCB 38 x 12 mm, pin row 1.5 mm from one short end,
  # glass 30 x 11.5 mm from 3.5 to 33.5 mm past the pin row. The opening clears the glass by 0.5 mm all
  # round, so the glass sits in the 1.2 mm plate. Centre is in Ergogen coordinates (KiCad x - 60, 140 - KiCad y).
  display_w: 12.5    # across the header row, glass is 11.5 mm
  display_l: 31      # along the module, from 3.0 mm past the pins to 34.0 mm
  display_cx: 110.25 # J3 pin row centre, KiCad x 170.25
  display_cy: 57.6   # 18.5 mm past the pin row (KiCad y 100.9), KiCad y 82.4

points:
  zones:
    matrix:
      key:
        padding: ky
        spread: kx
        width: kx
        height: ky
        led: north
      columns:
        pinky:
          key.col_index: 0
        pinky2:
          key.col_index: 1
        ring:
          key.col_index: 2
          key.stagger: stagger_ring
        middle:
          key.col_index: 3
          key.stagger: stagger_middle
        index:
          key.col_index: 4
          key.stagger: stagger_index
        outer:
          key.col_index: 5
          key.stagger: stagger_outer
      # Ergogen stacks rows bottom-up; row_code matches the schematic (F=1 N=2 T=3 H=4 B=5)
      rows:
        bottom:
          row_code: 5
        home:
          row_code: 4
        top:
          row_code: 3
        number:
          row_code: 2
        fn:
          row_code: 1

    # thumb row and inner column, placed from Keebart's key centres relative to matrix_pinky_bottom
    thumb0:
      anchor: {ref: matrix_pinky_bottom, shift: [1.5 kx, -1 ky - pinky_lift + 1]} # SW60 up 1 mm with the pinky side
      key: {row_code: 6, col_index: 0, width: kx, height: ky, led: north}
    thumb1:
      anchor: {ref: matrix_pinky_bottom, shift: [2.5 kx, -0.875 ky - pinky_lift]}
      key: {row_code: 6, col_index: 1, width: kx, height: ky, led: north}
    thumb2:
      anchor: {ref: matrix_pinky_bottom, shift: [3.5 kx, -0.875 ky - pinky_lift]}
      key: {row_code: 6, col_index: 2, width: kx, height: ky, led: north}
    thumb3: # the user's placement in KiCad to follow Keebart's thumb cluster (was fitted to caliper
      # measurements: keycap corners 1.54 mm and 3.75 mm from TH2's), 0.374 right and 0.65 up from that fit
      anchor: {ref: matrix_pinky_bottom, shift: [4.5 kx + 2.25, -1 ky - pinky_lift + 0.65], rotate: -8.06}
      key: {row_code: 6, col_index: 3, width: kx, height: ky, led: north}
    thumb4: # 1.5u tall key, LED west like Keebart's. The user's placement in KiCad to follow Keebart's thumb
      # cluster; keycap gaps 2.16 mm to TH3, 1.22 mm to SW55 and 0.88 mm to encoder 1.
      anchor: {ref: matrix_pinky_bottom, shift: [105.060, -16.630 - pinky_lift], rotate: -19.63}
      key: {row_code: 6, col_index: 4, width: kx, height: 1.5 ky, led: west}
    encoder1: # Keebart's knob position moved 2.875 mm down for knob room (SW65), set by the user in KiCad with
      # the thumb cluster; x stays on encoder 2's column. Electrically thumb row column 5.
      anchor: {ref: matrix_pinky_bottom, shift: [6 kx, 0.625 ky - 2.875 - pinky_lift]}
      key: {row_code: 6, col_index: 5, width: kx, height: ky, combo: true, led: north}
    encoder2: # above encoder 1 (SW16), 21.5 mm apart. Never closer than 18: at 17 the combo footprints short,
      # and turning one 180 instead shorts its socket pad into the outer column key's socket
      anchor: {ref: matrix_pinky_bottom, shift: [6 kx, 0.625 ky + 18 - pinky_lift]}
      key: {row_code: 1, col_index: 6, width: kx, height: ky, combo: true, led: north}

outlines:
  # Upper half of the board outline: the earlier key-rectangle outline (1.5 mm past the key pitch, enough for socket
  # pads and combo tab slots at 9.8 mm from key centre), whose offset steps the user preferred along the top
  # thumbs are left out: the drawn lower half owns them, and TH4's rectangle would leave a hairline sliver along it
  _keycaps:
    - what: rectangle
      where: /^(matrix|encoder)/
      size: [kx + 3, ky + 3]
  # inner column from encoder 1 up to the top: encoders, display, controller and USB-C live here
  # its top is anchored to the outer column's F-row key so the long top edge stays level with it
  _inner:
    - what: polygon
      points:
        - {ref: matrix_outer_fn, shift: [9, 10]}
        - {ref: matrix_outer_fn, shift: [kx + 10.5, 10]}
        - {ref: encoder1, shift: [10.5, -10]}
        - {ref: encoder1, shift: [-9, -10]}
  _raw:
    - what: outline
      name: _keycaps
    - operation: add
      what: outline
      name: _inner
  # morphological closing (grow 3 mm, shrink 3 mm) fills the slivers the overlapping key rectangles
  # leave at stagger steps, which would otherwise be milled as holes
  _closed:
    - what: outline
      name: _raw
      expand: 3
      joints: pointy
  _stepped:
    - what: outline
      name: _closed
      expand: -3
      joints: pointy
  # Lower half of the board outline, drawn by the user: straight right edge
  # down to TH4, along TH4's outer and bottom edges, a straight bottom under the thumbs and a chamfer up to the
  # pinky column. Margin is 1.5 mm past the 18 x 17 key pitch. Corners on keys are anchored to them; the three
  # marked "fitted" points are where edges cross and were computed for the current thumb positions, so
  # recompute them if TH0-TH4 or the encoder column move.
  _shape:
    - what: polygon
      points:
        - {ref: matrix_pinky_fn, shift: [-10.5, 10]}
        - {ref: matrix_pinky2_fn, shift: [9, 10]}
        - {ref: matrix_ring_fn, shift: [-9, 10]}
        - {ref: matrix_ring_fn, shift: [9, 10]}
        - {ref: matrix_middle_fn, shift: [-9, 10]}
        - {ref: matrix_middle_fn, shift: [9, 10]}
        - {ref: matrix_index_fn, shift: [-9, 10]}
        - {ref: matrix_index_fn, shift: [9, 10]}
        - {ref: matrix_outer_fn, shift: [-9, 10]}
        - {ref: matrix_outer_fn, shift: [kx + 10.5, 10]}
        - {ref: matrix_pinky_bottom, shift: [118.500, -11.704]} # fitted: right edge meets TH4's outer edge
        - {ref: thumb4, shift: [10.5, -14.25]}
        - {ref: matrix_pinky_bottom, shift: [93.745, -29.223]} # fitted: TH4's bottom edge meets the bottom line
        - {ref: matrix_pinky_bottom, shift: [16.500, -29.223]} # fitted: bottom line under TH3's lowest corner
        - {ref: matrix_pinky_bottom, shift: [-10.5, -10]}
  # Board outline (PCB edge and case): the stepped top of _stepped combined with the drawn lower half
  board:
    - what: outline
      name: _stepped
    - operation: add
      what: outline
      name: _shape
  # switch plate cutouts for a plate case (Choc plate hole 13.8 mm)
  _switch_holes:
    - what: rectangle
      where: true
      size: [13.8, 13.8]

  # case shell outlines. Port rectangles are centred on the board edge at each USB-C, in Ergogen
  # coordinates (KiCad x - 60, 140 - KiCad y). Recompute them if J1/J2 move on the board.
  _case_outer:
    - what: outline
      name: board
      expand: wall
  _case_cavity:
    - what: outline
      name: board
      expand: fit
  _display_hole:
    - what: rectangle
      where:
        shift: [display_cx, display_cy]
      size: [display_w, display_l]
  _port_host:
    - what: rectangle
      where:
        shift: [108.78, 78.62]
      size: [10, 8]
  _port_link:
    - what: rectangle
      where:
        shift: [118.5, 46.32]
      size: [8, 10]

cases:
  bottom:
    - what: outline
      name: board
      extrude: 2
  plate:
    - what: outline
      name: board
      extrude: plate_t
    - what: outline
      name: _switch_holes
      extrude: plate_t
      operation: subtract
    - what: outline
      name: _display_hole
      extrude: plate_t
      operation: subtract

  # Tray case for print tests before committing to aluminium. No screw bosses or magnets yet:
  # how the PCB is held is still open, so only the shell and the two port openings are defined.
  shell:
    - what: outline
      name: _case_outer
      extrude: case_h
    - what: outline
      name: _case_cavity
      extrude: case_h
      shift: [0, 0, floor]
      operation: subtract
    - what: outline
      name: _port_host
      extrude: port_h
      shift: [0, 0, port_z]
      operation: subtract
    - what: outline
      name: _port_link
      extrude: port_h
      shift: [0, 0, port_z]
      operation: subtract

pcbs:
  outline_only:
    template: kicad8
    outlines:
      edge:
        outline: board
